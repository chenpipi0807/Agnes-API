name: Build Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Compile server TypeScript
        run: npx tsc -p tsconfig.server.json

      - name: Build executables (all platforms)
        run: |
          npx @yao-pkg/pkg dist/server.js \
            --targets node20-win-x64,node20-macos-x64,node20-macos-arm64,node20-linux-x64 \
            --output release/Agnes-AI-Studio \
            --config package.json \
            --compress GZip

      - name: Rename outputs
        run: |
          ls release/
          mv release/Agnes-AI-Studio-win.exe   release/Agnes-AI-Studio-Windows.exe   || true
          mv release/Agnes-AI-Studio-macos     release/Agnes-AI-Studio-Mac-Intel     || true
          mv release/Agnes-AI-Studio-macos-arm64 release/Agnes-AI-Studio-Mac-AppleSilicon || true
          mv release/Agnes-AI-Studio-linux     release/Agnes-AI-Studio-Linux         || true
          ls release/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
